name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e .
      - name: Tests without external data or model calls
        run: >-
          python -m unittest
          tests.test_package_metadata tests.test_cli tests.test_script_launcher tests.test_artifacts tests.test_storage
          tests.test_origins tests.test_settings tests.test_research_pipeline
      - run: node tests/test_portal_frontend.mjs
      - run: python -m gfi_prototype --help
